# Sample config: Snapmaker U1 toolhead (AT32F415RC) as a single extruder.
# Pins from the U1's e0 section (printer.cfg 20260716 backup).
# Mainline-compatible (fork-only options removed: probe_speed, *_overshoot).
#
# Copy this as toolhead.cfg in your printer_data config and [include] it.
# Set [mcu e0] serial to your toolhead's USB by-id path (see docs/TOOLHEAD_ON_RASPBERRY_PI.md).

[mcu e0]
serial: /dev/serial/by-id/usb-Klipper_stm32f105xc-<version>-<unique-serial>-if00

[extruder]
step_pin: e0:PA8
dir_pin: e0:PA9
enable_pin: !e0:PB2
microsteps: 16
rotation_distance: 4.95
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_accel: 5000
max_extrude_only_velocity: 100
max_extrude_cross_section: 500
heater_pin: e0:PB5
sensor_type: Generic 3950
sensor_pin: e0:PA2
control: pid
pid_Kp: 33.540
pid_Ki: 9.317
pid_Kd: 30.186
min_temp: -100
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 200
smooth_time: 2

[heater_fan e0_nozzle_fan]
pin: !e0:PB0
heater: extruder
heater_temp: 45
fan_speed: 1
shutdown_speed: 0

[inductance_coil extruder]
pin: e0:PA0
z_offset: -0.05
freq_cal_mode: 1
samples: 4
samples_tolerance: 0.020
samples_tolerance_retries: 10
capture_over_cnt: 200
cal_window_size: 5
cal_time_out: 2
speed: 2.0
sample_retract_dist: 1
relative_trigger_freq: 300
max_freq: 1650000
min_freq: 1200000
horizontal_move_z: 100

[lis2dw e0_lis2dw]
cs_pin: e0:PA4
spi_bus: spi1
axes_map: y,x,z
